name: CI

on:
  push:
    branches:
      - master
      - main
      - develop
      - work
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Luau package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ github.token }}
          cache: true

      - name: Install Wally packages
        run: wally install

      - name: Validate repository structure
        run: python scripts/validate_project.py

      - name: Check formatting
        run: stylua --check module test .lune

      # .lune is a Lune script; selene's Roblox std rejects its string requires.
      - name: Lint Luau
        run: selene module test

      - name: Build Rojo place
        run: |
          mkdir -p build
          rojo build dev.project.json --output build/Luau_MathLIB.rbxlx

      - name: Run TestEZ specs
        run: lune run test build/Luau_MathLIB.rbxlx
